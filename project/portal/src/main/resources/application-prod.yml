pagehelper:
  reasonable: true
  helper-dialect: postgresql

spring:
  web:
    locale: ko
    resources:
      chain:
        compressed: true
        cache: true
      add-mappings: true
  main:
    allow-circular-references: true
  output:
    ansi:
      enabled: detect
  devtools:
    livereload:
      enabled: true
    restart:
      enabled: true
  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1024MB
  h2:
    console:
      enabled: true
  datasource:
    hikari:
      jdbc-url: jdbc:postgresql://<INTERNAL_HOST>:5432/data_catalog
      username: data_catalog
      password: <PASSWORD>
      driver-class-name: org.postgresql.Driver
      maximumPoolSize: 3
      connection-test-query: select
  mail:
    host: <INTERNAL_HOST>
    port: 25
    properties:
      mail:
        debug: true
        smtp:
          connectiontimeout: 5000
          auth: false
          starttls:
            enable: false
          ssl:
            enable: false

logging:
  level:
    root: info
    com:
      mobigen: info

server:
  port: 38080
  servlet:
    session:
      timeout: 7200
      cookie:
        name: msf-session-id
    encoding:
      charset: UTF-8
    context-path: /
  compression:
    enabled: true
  tomcat:
    uri-encoding: UTF-8
    relaxed-query-chars: ['|',']','[','^','\','{','}']
  error:
    whitelabel:
      enabled: false
    path: /error
  ssl:
    enabled: true
    enabled-protocols: TLSv1.2
    key-store:  "/opt/ovp/portal/keystore/certificate.p12"
    key-store-type: "PKCS12"  # "JKS"
    key-store-password: ENC(bzTkiVKgLirHJc6v7mPW0aqRChnOU8V6)  # jks 또는 pfx 암호
    ciphers: TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA256,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
    #key-alias: "datalake" # (필요시) Alias 명 지정. CSR 자동 생성시에는 CN 명
    #trust-store: # (필요시) "sslcert.co.kr.jks" 또는 "sslcert.co.kr.pfx" 지정. CSR 직접 생성시에는, 루트/체인 스토어 파일 지정
    #trust-store-password: "xxxxxxxx"  # (필요시) jks 또는 pfx 암호
  max-http-request-header-size: 30000

i18n:
  basenames: i18n/messages, i18n/exception, i18n/validation

http-client-configuration:
  max-total: 300
  default-max-per-route: 50
  default-keep-alive-duration: -1
  connection-reqeust-timeout: 3000
  connection-timeout: 3000
  socket-timeout: -1
  idle-timeout: 60

properties:
  activeSendMail:
    data-request: false
    synonym: false
  bigExtractToken: <EXTRACT_TOKEN>
  maxFileSize: 1GB # GB, MB, KB
  fileUploadPath: /opt/ovp/portal/data
  csvFileUploadPath: /opt/ovp/portal/csv
  fileUploadPathSample: /opt/ovp/portal/sample
  allowedExtension: zip,pptx,pptm,ppt,xls,xlsx,xlsm,csv,pdf,jpg,jpeg,png
  allowedImgExtension: jpg,jpeg,png
  loginDeactivationDateThreshold: 90
  iris:
    security:
      ignores: /css/**, /fonts/**, /img/**, /js/**, /favicon.ico
      permit-alls: /css/**, /fonts/**, /img/**, /js/**, /favicon.icom, /api/**, /_nuxt/**, /, /api/authenticate/key, /api/authenticate, /api/csrf-token, /h2-console/**, /sample/public-key, /sample/authenticate, /error, /register, /test, /sso, /ssoLogin
      redirect-url: /
      iframe-option: same-origin #disable, same-origin, deny
      csrf: true
      cors:
        pattern: /** #/auth/**
        allowed-origins: http://<INTERNAL_HOST>:38080 #"*" #http://server-name:port
        allowed-methods: "*" #PUT,DELETE,GET,POST ...
        allowed-headers: "*" #Context-Type, ...
        allow-credentials: true
      same-site: Lax #None, Lax, Strict
    access-token:
      name: x-access-token
      secret: jwt-secrect-b-iris
      max-age: 60
    refresh-token:
      name: x-refresh-token
      secret: jwt-secrect-b-iris
      max-age: 28800 # 3600
    route:
      locales: ko,en,zh,ja
    auth:
      rsa-enabled: true
  trino:
    hikari:
      jdbc-url: jdbc:trino://<INTERNAL_HOST>:8080/
      user: admin
  elastic:
    server:
      scheme: http
      host: <INTERNAL_HOST>
      port: 9200
  fastapi:
    server:
      scheme: http
      host: <INTERNAL_HOST>
      port: 28800
  superadmin:
    id: admin
    passwd: <PASSWORD> # <PASSWORD>
  essync:
    url: 
      update: http://<INTERNAL_HOST>:8000/v1/essync/update
      updates: http://<INTERNAL_HOST>:8000/v1/essync/updates
      roleupdates: http://<INTERNAL_HOST>:8000/v1/essync/roleupdates
      convertcategory: http://<INTERNAL_HOST>:8000/v1/essync/convertcategory
  synonymsync:
    url: http://<INTERNAL_HOST>:8000/v1/essync/synonym
  categorycount:
    url: http://<INTERNAL_HOST>:8000/v1/essync/getclassificationcount
  ingestion:
    url: http://<INTERNAL_HOST>:8585/api/v1/ingestion/execute
  bigextract:
    url: http://<INTERNAL_HOST>:13200/largedata/requestdata