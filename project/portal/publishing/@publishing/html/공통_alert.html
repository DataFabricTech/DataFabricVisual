<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>데이터 카탈로그</title>
    <link href="../css/common.css" rel="stylesheet" />
    <link href="../css/style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="mu-modal">
      <!-- mu-alert -->
      <div class="mu-alert">
        <div class="mu-alert-head">
          <strong>알림</strong>
        </div>
        <div class="mu-alert-body">
          <p class="mu-alert-msg">선택한 데이터를 영구적으로 삭제합니다. <br />정말 삭제 하시겠습니까?</p>
          <!-- 데이터(를)  /  카테고리(를)  /  용어사전(을)  /  표준용어(를) -->
        </div>
        <div class="mu-alert-foot">
          <button type="button" class="mu-btn"><span>취소</span></button>
          <button type="button" class="mu-btn mu-btn-primary"><span>확인</span></button>
        </div>
        <div class="mu-alert-close-btn">
          <button type="button" title="해당 알림창 닫기" class="mu-btn mu-btn-close"><i class="mu-icon-svg close"></i><span>알림창닫기</span></button>
        </div>
      </div>
      <!-- //mu-alert -->
    </div>
  </body>
</html>
