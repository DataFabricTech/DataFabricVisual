version: '0.1'

services:
  data-catalog-portal:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    image: data-catalog-portal:0.1
    container_name: data-catalog-portal
    ports:
      - "443:443"
      - "38080:80"
    volumes:
      - $DATA_CATALOG_SOLUTION_DATA/data-catalog-portal/conf:/data_catalog_portal/conf
      - $DATA_CATALOG_SOLUTION_DATA/data-catalog-portal/data:/data_catalog_portal/data
      - $DATA_CATALOG_SOLUTION_DATA/data-catalog-portal/keystore:/data_catalog_portal/keystore
      - $DATA_CATALOG_SOLUTION_DATA/data-catalog-portal/logs:/data_catalog_portal/logs
      - $DATA_CATALOG_SOLUTION_DATA/ingestion/system_config:/data_catalog_portal/data/hive_system_config
    working_dir: /data_catalog_portal
    command: ["sh", "-c", "set -e; /data_catalog_portal/docker_start.sh"]