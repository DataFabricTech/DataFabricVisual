version: '0.1'

services:
  DataCatalogPortal:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    image: data-catalog-portal:0.1
    container_name: DataCatalogPortal
    ports:
      - "443:443"
      - "38080:80"
    volumes:
      - /DATA_CATALOG/data/data-catalog-portal/conf:/data_catalog_portal/conf
      - /DATA_CATALOG/data/data-catalog-portal/data:/data_catalog_portal/data
      - /DATA_CATALOG/data/data-catalog-portal/keystore:/data_catalog_portal/keystore
      - /DATA_CATALOG/data/data-catalog-portal/logs:/data_catalog_portal/logs
    command: ["sh", "-c", "set -e; /data_catalog_portal/docker_start.sh"]